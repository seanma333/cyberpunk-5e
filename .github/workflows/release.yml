name: Release

# The version lives in the release history, not in the repo: module.json's
# version field is a 0.0.0 placeholder that this workflow overwrites at build
# time. `gh release list` is the source of truth.
#
#   push to main   -> patch bump from the latest release (1.1.7 -> 1.1.8)
#   push a v* tag  -> that exact version, for minor and major bumps
#   manual run     -> an explicit version, without tagging locally
#
# Put [skip ci] in a commit message to push to main without cutting a release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit version, e.g. 2.0.0 (blank = patch bump)"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Inputs arrive as env vars rather than inline ${{ }} so that a crafted
      # tag or dispatch value cannot be interpolated into the shell.
      - name: Resolve version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          # Used only until the first release exists; derivation takes over after.
          INITIAL_VERSION: "1.1.7"
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
              version="${REF_NAME#v}"
              source="explicit tag $REF_NAME"
          elif [ -n "${INPUT_VERSION:-}" ]; then
              version="${INPUT_VERSION#v}"
              source="manual input"
          else
              latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
              # gh prints its 404 body to STDOUT when a repo has no releases, so a
              # non-empty result is not proof of one. Accept only a version tag.
              if ! printf '%s' "$latest" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
                  latest=""
              fi
              if [ -z "$latest" ]; then
                  version="$INITIAL_VERSION"
                  source="initial release"
              else
                  base="${latest#v}"
                  major="${base%%.*}"
                  rest="${base#*.}"
                  minor="${rest%%.*}"
                  patch="${rest##*.}"
                  version="$major.$minor.$((patch + 1))"
                  source="patch bump from $latest"
              fi
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::resolved version '$version' is not semver (from $source)"
              exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version ($source)"

      # Compendium packs are build output: the repo tracks only the JSON under
      # src/packs/, so the LevelDB directories Foundry loads are built here.
      - name: Build compendium packs
        run: npm run pack

      # The bug this workflow exists to prevent is shipping a module whose
      # compendiums are empty, so fail loudly rather than publish one.
      - name: Verify packs contain data
        run: |
          set -euo pipefail
          status=0
          for src in src/packs/*/; do
              name=$(basename "$src")
              [ -n "$(find "$src" -name '*.json' -print -quit)" ] || continue
              out="packs/$name"
              if [ ! -f "$out/CURRENT" ] || [ -z "$(find "$out" -name '*.ldb' -print -quit)" ]; then
                  echo "::error::$name has JSON sources but produced no LevelDB data"
                  status=1
              fi
          done
          exit $status

      - name: Stamp version into module.json
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          python3 - "$VERSION" <<'PY'
          import json, sys
          with open("module.json") as f:
              module = json.load(f)
          module["version"] = sys.argv[1]
          with open("module.json", "w") as f:
              json.dump(module, f, indent=2)
              f.write("\n")
          print(f"module.json version set to {sys.argv[1]}")
          PY

      # LOCK and LOG are per-machine LevelDB process state. The numbered
      # *.log files are the write-ahead log and MUST ship: they can hold
      # documents not yet compacted into a .ldb file.
      - name: Package
        run: |
          zip -r module.zip \
            module.json packs scripts assets README.md \
            -x '*.DS_Store' '*/LOCK' '*/LOG' '*/LOG.old'
          unzip -l module.zip | tail -1

      # On the auto path the tag does not exist yet, so the release creates it
      # at this commit. Tags created with GITHUB_TOKEN do not trigger workflows,
      # so this cannot loop back into another release.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.resolve.outputs.version }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
              gh release create "v$VERSION" module.zip module.json \
                --title "v$VERSION" --generate-notes
          else
              gh release create "v$VERSION" module.zip module.json \
                --title "v$VERSION" --generate-notes --target "$GITHUB_SHA"
          fi
